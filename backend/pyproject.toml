[project]
name = "caremesh-backend"
version = "0.1.0"
description = "CareMesh AI backend. Portfolio simulation, not a real healthcare product."
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.30",
    "alembic>=1.14",
    "pydantic[email]>=2.9",
    "pydantic-settings>=2.6",
    "argon2-cffi>=23.1",
    "pyjwt>=2.15",
    "structlog>=24.4",
    "aiokafka>=0.14.0",
    "pgvector>=0.5.0",
    "prometheus-client>=0.26.0",
    "redis>=8.1.0",
    "fastembed>=0.8.0",
    "httpx>=0.28.1",
    "mcp>=2.0.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "httpx>=0.28",
    "ruff>=0.8",
    "mypy>=2.4.0",
    "pytest-cov>=7.1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
# Autogenerated by Alembic; long lines are fine there.
"migrations/versions/*" = ["E501"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "integration: tests that need the dockerized Postgres from docker compose",
]

[tool.mypy]
python_version = "3.13"
packages = ["app"]
ignore_missing_imports = true
warn_unused_ignores = true
warn_redundant_casts = true
no_implicit_optional = true
check_untyped_defs = true

[tool.coverage.run]
source = ["app"]
branch = true

[tool.coverage.report]
skip_covered = false
show_missing = true
# The floor is set just under the measured baseline so it catches drops
# without turning every refactor into a coverage chase.
fail_under = 80
