# CareMesh AI local stack. Everything here is free and runs locally.
#
# Default services (no profile): postgres, redis, redpanda.
#   docker compose up -d
# The API runs on the host during dev (cd backend && uv run uvicorn app.main:app).
# The app profile containerizes the backend (API, relay, consumer):
#   docker compose --profile app up -d --build
# The observability profile (Prometheus, Grafana) stays off by default.

name: caremesh

services:
  postgres:
    # pgvector build of Postgres 16 (RAG vector storage, ADR 0006). Swapping
    # from alpine required one dev volume reset; data is disposable seed data.
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: caremesh
      POSTGRES_PASSWORD: caremesh_dev_password
      POSTGRES_DB: caremesh
    ports:
      # 5433 on the host because a Homebrew postgresql@16 owns 127.0.0.1:5432.
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U caremesh -d caremesh"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "no", "--maxmemory", "128mb", "--maxmemory-policy", "allkeys-lru"]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  redpanda:
    image: redpandadata/redpanda:v24.2.18
    command:
      - redpanda
      - start
      - --mode=dev-container
      - --smp=1
      - --memory=512M
      - --reserve-memory=0M
      - --overprovisioned
      - --kafka-addr=internal://0.0.0.0:9093,external://0.0.0.0:9092
      - --advertise-kafka-addr=internal://redpanda:9093,external://localhost:9092
    ports:
      - "${REDPANDA_KAFKA_PORT:-9092}:9092"
      - "${REDPANDA_ADMIN_PORT:-9644}:9644"
    volumes:
      - redpanda_data:/var/lib/redpanda/data
    healthcheck:
      test: ["CMD-SHELL", "rpk cluster health | grep -q 'Healthy:.*true'"]
      interval: 5s
      timeout: 5s
      retries: 20

  # Containerized backend (off by default; dev runs it on the host):
  #   docker compose --profile app up -d --build
  migrate:
    build: &backend_build
      context: .
      dockerfile: docker/backend.Dockerfile
    profiles: ["app"]
    command: ["alembic", "upgrade", "head"]
    environment: &backend_env
      DATABASE_URL: postgresql+asyncpg://caremesh:caremesh_dev_password@postgres:5432/caremesh
      REDIS_URL: redis://redis:6379/0
      KAFKA_BOOTSTRAP_SERVERS: redpanda:9093
    depends_on:
      postgres:
        condition: service_healthy

  api:
    build: *backend_build
    profiles: ["app"]
    environment: *backend_env
    ports:
      - "${API_PORT:-8000}:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      redpanda:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/healthz')\""]
      interval: 5s
      timeout: 3s
      retries: 20

  relay:
    build: *backend_build
    profiles: ["app"]
    command: ["python", "-m", "app.workers.relay"]
    environment: *backend_env
    depends_on:
      migrate:
        condition: service_completed_successfully
      redpanda:
        condition: service_healthy

  consumer:
    build: *backend_build
    profiles: ["app"]
    command: ["python", "-m", "app.workers.conversation_consumer"]
    environment: *backend_env
    depends_on:
      migrate:
        condition: service_completed_successfully
      redpanda:
        condition: service_healthy

  # Observability stack (spec P12). Off by default to spare the laptop:
  #   docker compose --profile observability up -d
  prometheus:
    image: prom/prometheus:v2.53.0
    profiles: ["observability"]
    command: ["--config.file=/etc/prometheus/prometheus.yml"]
    ports:
      - "${PROMETHEUS_PORT:-9090}:9090"
    volumes:
      - ./docker/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"

  grafana:
    image: grafana/grafana:11.1.0
    profiles: ["observability"]
    environment:
      # Dev only: anonymous viewing so the dashboard is one click away.
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: "Viewer"
      GF_SECURITY_ADMIN_PASSWORD: "caremesh-dev"
    ports:
      - "${GRAFANA_PORT:-3001}:3000"
    volumes:
      - ./docker/grafana/provisioning:/etc/grafana/provisioning:ro
    depends_on:
      - prometheus

volumes:
  postgres_data:
  redpanda_data:
