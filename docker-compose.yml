# CareMesh AI local stack. Everything here is free and runs locally.
#
# Default services (no profile): postgres, redis, redpanda.
#   docker compose up -d
# The API runs on the host during dev (cd backend && uv run uvicorn app.main:app).
# A containerized API can be added under an "app" profile when a Dockerfile lands.
# The observability profile (Prometheus, Grafana, OTel) arrives after the
# vertical slice works, per the Phase 0 proposal, and stays off by default.

name: caremesh

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: caremesh
      POSTGRES_PASSWORD: caremesh_dev_password
      POSTGRES_DB: caremesh
    ports:
      # 5433 on the host because a Homebrew postgresql@16 owns 127.0.0.1:5432.
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U caremesh -d caremesh"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "no", "--maxmemory", "128mb", "--maxmemory-policy", "allkeys-lru"]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  redpanda:
    image: redpandadata/redpanda:v24.2.18
    command:
      - redpanda
      - start
      - --mode=dev-container
      - --smp=1
      - --memory=512M
      - --reserve-memory=0M
      - --overprovisioned
      - --kafka-addr=internal://0.0.0.0:9093,external://0.0.0.0:9092
      - --advertise-kafka-addr=internal://redpanda:9093,external://localhost:9092
    ports:
      - "${REDPANDA_KAFKA_PORT:-9092}:9092"
      - "${REDPANDA_ADMIN_PORT:-9644}:9644"
    volumes:
      - redpanda_data:/var/lib/redpanda/data
    healthcheck:
      test: ["CMD-SHELL", "rpk cluster health | grep -q 'Healthy:.*true'"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  postgres_data:
  redpanda_data:
