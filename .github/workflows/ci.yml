name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: Start the stack (Postgres with pgvector, Redis, Redpanda)
        run: docker compose up -d --wait

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Backend dependencies
        working-directory: backend
        run: uv sync --frozen

      - name: Frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Backend lint
        working-directory: backend
        run: |
          uv run ruff check .
          uv run ruff format --check .

      - name: Migrations apply cleanly
        working-directory: backend
        run: uv run alembic upgrade head

      - name: Backend tests (unit + integration)
        working-directory: backend
        run: uv run pytest -q

      - name: Frontend lint, typecheck, tests
        working-directory: frontend
        run: |
          npm run lint
          npm run typecheck
          npm run test

      - name: Evals (risk, dira, retrieval), gated at 100 percent
        working-directory: backend
        run: uv run python -m evals.run --dataset all
