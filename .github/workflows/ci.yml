name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          # gitleaks scans history, so it needs more than the last commit.
          fetch-depth: 0

      - name: Secret scan (gitleaks)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Start the stack (Postgres with pgvector, Redis, Redpanda)
        run: docker compose up -d --wait

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Backend dependencies
        working-directory: backend
        run: uv sync --frozen

      - name: Frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Backend lint
        working-directory: backend
        run: |
          uv run ruff check .
          uv run ruff format --check .

      - name: Backend type check
        working-directory: backend
        run: uv run mypy

      - name: Migrations apply cleanly
        working-directory: backend
        run: uv run alembic upgrade head

      - name: Backend tests (unit + integration) with the coverage floor
        working-directory: backend
        run: uv run pytest -q --cov --cov-report=term:skip-covered --cov-report=xml

      - name: Upload coverage report
        uses: actions/upload-artifact@v7
        with:
          name: backend-coverage
          path: backend/coverage.xml

      - name: Generated API types are current
        run: |
          ./scripts/gen-api-types.sh
          git diff --exit-code -- frontend/openapi.json frontend/src/lib/api-schema.d.ts \
            || (echo "Run ./scripts/gen-api-types.sh and commit the result" && exit 1)

      - name: Frontend lint, typecheck, tests
        working-directory: frontend
        run: |
          npm run lint
          npm run typecheck
          npm run test

      - name: Frontend production build
        working-directory: frontend
        run: npm run build

      - name: Evals (risk, dira, retrieval), gated at 100 percent
        working-directory: backend
        run: uv run python -m evals.run --dataset all

      - name: Dependency audit (backend)
        working-directory: backend
        run: |
          uv export --frozen --no-dev --no-hashes --no-emit-project -o /tmp/requirements.txt
          uvx --python 3.13 pip-audit --strict --desc=off -r /tmp/requirements.txt

      - name: Dependency audit (frontend, production dependencies)
        working-directory: frontend
        run: npm audit --omit=dev --audit-level=high
